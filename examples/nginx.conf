# nginx: serve snapshots to crawlers, the normal app to everyone else.
#
#   crawler-snapshot snapshot https://your-site.example --out /var/www/app/_snapshots
#
# Put the map block in the http {} context and the server block where your site lives.
# The list below is generated from data/crawlers.json. Refresh it with
# `node scripts/sync-examples.mjs`, or paste `crawler-snapshot agents --format nginx`.
#
# Status: written from nginx documentation and NOT run against a live nginx by the author
# of this repo. Test it with `nginx -t` and a curl with a crawler User-Agent before trusting it.

# BEGIN CRAWLERS
map $http_user_agent $crawler_snapshot {
    default "/_no_snapshot";
    "~*(GPTBot|OAI-SearchBot|ChatGPT-User|ClaudeBot|Claude-User|Claude-SearchBot|PerplexityBot|Perplexity-User|CCBot|Googlebot|Google-InspectionTool|bingbot|Applebot|meta-externalagent|meta-externalfetcher|facebookexternalhit|Amazonbot|MistralAI-User|MistralAI-Index|MistralAI-Training|DuckAssistBot)" "/_snapshots";
}
# END CRAWLERS

server {
    listen 80;
    server_name your-site.example;
    root /var/www/app;

    # The answer depends on the User-Agent, so say so. "always" adds it to error responses too.
    add_header Vary User-Agent always;

    # Do not let anyone find the raw snapshot files by URL.
    location /_snapshots/ {
        internal;
    }

    location / {
        # For a crawler the first candidate is /_snapshots/<route>/index.html.
        # For everyone else it is /_no_snapshot/<route>/index.html, which does not exist,
        # so try_files moves on to your normal files and the SPA fallback.
        try_files $crawler_snapshot$uri/index.html $uri $uri/ /index.html;
    }
}
